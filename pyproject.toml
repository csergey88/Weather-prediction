[tool.poetry]
name = "weather-bot"
version = "0.1.0"
description = "Telegram weather forecast bot with multi-source aggregation"
authors = []
packages = [{include = "weather_bot", from = "src"}]

[tool.poetry.dependencies]
python = "^3.12"
aiogram = "^3.13"
httpx = "^0.27"
pydantic = "^2.8"
pydantic-settings = "^2.4"
aiosqlite = "^0.20"
cachetools = "^5.4"
scikit-learn = "^1.5"
lightgbm = "^4.5"
joblib = "^1.4"
tenacity = "^9.0"
geopy = "^2.4"

[tool.poetry.group.dev.dependencies]
pytest = "^8.3"
pytest-asyncio = "^0.24"
respx = "^0.21"
pytest-cov = "^5.0"
ruff = "^0.6"
mypy = "^1.11"

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
pythonpath = ["src"]

[tool.ruff]
line-length = 100
target-version = "py312"

[build-system]
requires = ["poetry-core"]
build-backend = "poetry.core.masonry.api"
